<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge of Heroes | Forging Soon</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/images/Thumbnail.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background-color: #090a0c;
      background-image:
        radial-gradient(circle at 50% 35%, rgba(255, 107, 26, 0.14) 0%, rgba(9, 10, 12, 0.94) 60%),
        url('/assets/images/e1GuQj.jpg');
      background-size: cover;
      background-position: center;
      color: #eceef2;
      font-family: 'Manrope', sans-serif;
    }
    .logo {
      width: 100%;
      max-width: 340px;
      margin: 0 auto 24px;
      mix-blend-mode: lighten;
      filter: drop-shadow(0 0 24px rgba(255, 107, 26, 0.22));
    }
    h1 {
      font-family: 'Cinzel', Georgia, serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ff9e44;
      margin-bottom: 12px;
    }
    p {
      max-width: 520px;
      color: #9ea5b3;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      padding: 13px 26px;
      border-radius: 6px;
      background: linear-gradient(135deg, #d94e14 0%, #ff6b1a 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 6px 20px rgba(255, 107, 26, 0.3);
    }
    .btn:hover {
      box-shadow: 0 8px 26px rgba(255, 107, 26, 0.48);
    }
  </style>
</head>
<body>
  <img src="/assets/images/Asset_1.png" alt="Forge of Heroes" class="logo">
  <h1>Forging in Progress</h1>
  <p>The anvil is hot. Original 5e adventures, homebrew rules, and table tools are being forged. Stay tuned for the reveal.</p>
  <a href="https://www.instagram.com/dm_ulftor/" target="_blank" rel="noopener noreferrer" class="btn">Follow @dm_ulftor</a>
</body>
</html>
